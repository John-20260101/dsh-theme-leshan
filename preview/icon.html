<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Leshan icon</title>
  <style>
    html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
    body { display: grid; place-items: center; }
    svg { display: block; }
  </style>
</head>
<body>
  <svg id="mark" width="1024" height="1024" viewBox="0 0 1024 1024" aria-label="Leshan">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#10202D" />
        <stop offset="0.52" stop-color="#08131C" />
        <stop offset="1" stop-color="#040B12" />
      </linearGradient>
      <radialGradient id="moon" cx="0.72" cy="0.26" r="0.46">
        <stop offset="0" stop-color="#F3E3C2" stop-opacity="0.42" />
        <stop offset="1" stop-color="#F3E3C2" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#C97A50" stop-opacity="0.05" />
        <stop offset="0.18" stop-color="#C97A50" />
        <stop offset="0.82" stop-color="#E0A875" />
        <stop offset="1" stop-color="#E0A875" stop-opacity="0.05" />
      </linearGradient>
      <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#D3A961" stop-opacity="0.05" />
        <stop offset="0.5" stop-color="#D3A961" />
        <stop offset="1" stop-color="#D3A961" stop-opacity="0.05" />
      </linearGradient>
      <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#7FB2E8" stop-opacity="0.04" />
        <stop offset="0.5" stop-color="#7FB2E8" />
        <stop offset="1" stop-color="#7FB2E8" stop-opacity="0.04" />
      </linearGradient>
    </defs>

    <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)" />
    <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#moon)" />

    <!-- The moon over the cliff line. -->
    <circle cx="712" cy="292" r="62" fill="#F6E8C9" fill-opacity="0.94" />
    <circle cx="712" cy="292" r="62" fill="none" stroke="#FFF6E4" stroke-opacity="0.35" stroke-width="3" />

    <!-- The cliff: two shoulders, one warm edge. -->
    <path d="M96 596 L292 430 L468 556 L664 398 L928 592 V596 Z" fill="#0B1A24" />
    <path d="M96 596 L292 430 L468 556 L664 398 L928 592"
          fill="none" stroke="#D3A961" stroke-opacity="0.55" stroke-width="5" stroke-linejoin="round" />

    <!-- Three rivers: one band per photograph, cooled as they recede. -->
    <rect x="96" y="626" width="832" height="86" rx="30" fill="url(#river)" />
    <rect x="156" y="742" width="712" height="62" rx="24" fill="url(#ridge)" opacity="0.86" />
    <rect x="96" y="834" width="832" height="42" rx="18" fill="url(#mist)" opacity="0.72" />

    <rect x="1.5" y="1.5" width="1021" height="1021" rx="223" fill="none" stroke="#E9F1F7" stroke-opacity="0.1" stroke-width="3" />
  </svg>
  <script>
    window.__PREVIEW_READY__ = true
  </script>
</body>
</html>
